<noscript><style>.tour-shell{display:none}.tour-static{padding:30px;max-width:1000px;margin:auto}.tour-static img{width:100%;height:auto}.tour-static article{margin:40px 0}.tour-static p{margin:16px 0;line-height:1.7}</style><main class="tour-static"><h1>Дом среди сосен</h1><article><h2>Первое знакомство</h2><img src="/images/tour/orbit-0-small.webp" alt="Первое знакомство. Невысокие объёмы, светлый камень и дерево. Дом открывается навстречу лесу." loading="lazy"><p>Невысокие объёмы, светлый камень и дерево. Дом открывается навстречу лесу.</p><p>Центральный фронтон обозначает вход, а два низких крыла расходятся в стороны между соснами. Светлая каменная кладка у основания зрительно связывает фасад с природными валунами на участке. Вертикальная деревянная обшивка продолжает рисунок стволов.</p><p>Гравийная дорожка приводит к широкой лестнице. Большие окна по обе стороны входа показывают жилые пространства, а тёмные переплёты и кровля собирают разные материалы в спокойную композицию.</p></article><article><h2>Со стороны подъезда</h2><img src="/images/tour/approach-small.webp" alt="Со стороны подъезда. Поворот дорожки постепенно раскрывает главный фасад и входную группу." loading="lazy"><p>Поворот дорожки постепенно раскрывает главный фасад и входную группу.</p><p>В этом ракурсе перед домом остаётся больше воздуха: на первом плане видны гравий, папоротники и крупные камни. Сосны обрамляют архитектуру, не закрывая центральный вход.</p><p>Низкая линия боковых крыльев удерживает масштаб дома близким к человеку. Светлая каменная часть фасада и деревянный фронтон хорошо читаются даже издалека; дорога направляет взгляд к ступеням.</p></article><article><h2>Передний боковой ракурс</h2><img src="/images/tour/orbit-1-small.webp" alt="Передний боковой ракурс. Скатная кровля, каменные опоры и остекление складываются в единый силуэт." loading="lazy"><p>Скатная кровля, каменные опоры и остекление складываются в единый силуэт.</p><p>С диагонального ракурса видны глубина дома и сопряжение кровель. Центральная входная часть выступает вперёд, а остеклённое жилое крыло вытягивается вдоль леса.</p><p>Вертикальная обшивка мягко меняет оттенок на солнце. Каменные участки у основания и между окнами создают устойчивый ритм, а прозрачные плоскости облегчают протяжённый фасад.</p></article><article><h2>Боковой фасад</h2><img src="/images/tour/orbit-2-small.webp" alt="Боковой фасад. Протяжённое остекление показывает, как жилые комнаты связаны с участком." loading="lazy"><p>Протяжённое остекление показывает, как жилые комнаты связаны с участком.</p><p>Большие окна занимают значительную часть длинного фасада. За стеклом видны светильники и мебель, а отражения сосен объединяют интерьер с окружающим лесом.</p><p>Над остеклением проходит спокойная линия тёмной кровли. Светлый каменный цоколь и деревянная обшивка торца удерживают общую материальную палитру дома.</p></article><article><h2>Терраса у гостиной</h2><img src="/images/tour/orbit-3-small.webp" alt="Терраса у гостиной. Деревянный настил продолжает жилое пространство вдоль стеклянного фасада." loading="lazy"><p>Деревянный настил продолжает жилое пространство вдоль стеклянного фасада.</p><p>Угловой ракурс раскрывает остеклённую гостиную и широкую террасу. Настил огибает жилой объём и создаёт место для спокойного отдыха рядом с домом.</p><p>Под фронтоном стекло поднимается выше обычного оконного проёма. Тёмные переплёты подчёркивают геометрию, а тон кровли перекликается с затенёнными участками леса.</p></article><article><h2>Со стороны террасы</h2><img src="/images/tour/orbit-4-small.webp" alt="Со стороны террасы. Широкая площадка перед домом собирает зоны отдыха под открытым небом." loading="lazy"><p>Широкая площадка перед домом собирает зоны отдыха под открытым небом.</p><p>Этот вид показывает фасад со стороны большой деревянной террасы. На ней расположена мягкая уличная мебель; остеклённые помещения открываются прямо к общей площадке.</p><p>Центральный фронтон остаётся композиционной опорой, а боковые крылья формируют спокойный фон. Между террасой и лесом сохранены камни и низкая растительность.</p></article><article><h2>Противоположный угол</h2><img src="/images/tour/orbit-5-small.webp" alt="Противоположный угол. Несколько объёмов читаются отдельно, сохраняя общий характер дома." loading="lazy"><p>Несколько объёмов читаются отдельно, сохраняя общий характер дома.</p><p>С этого угла особенно заметны разные направления скатов и чередование камня, дерева и стекла. Прозрачный фронтон жилой части соседствует с более закрытым деревянным объёмом.</p><p>Вечерний свет выделяет фактуру облицовки. Перед домом остаётся естественная лесная поверхность с валунами и папоротниками, без крупной сплошной площадки мощения.</p></article><article><h2>Остеклённый фронтон</h2><img src="/images/tour/orbit-6-small.webp" alt="Остеклённый фронтон. Высокое окно делает внутреннее пространство частью вечернего фасада." loading="lazy"><p>Высокое окно делает внутреннее пространство частью вечернего фасада.</p><p>Главный акцент кадра — стеклянная плоскость под центральным фронтоном. Через неё видны гостиная и тёплый свет внутри дома. Широкие ступени направляют движение к остеклённой части.</p><p>По сторонам расположены более низкие крылья с большими окнами. Каменное основание и деревянная обшивка сохраняют общий язык архитектуры, а сосны создают вертикальный передний план.</p></article><article><h2>Вид с дорожки сбоку</h2><img src="/images/tour/orbit-7-small.webp" alt="Вид с дорожки сбоку. Гравий, древесина и камень поддерживают естественный характер участка." loading="lazy"><p>Гравий, древесина и камень поддерживают естественный характер участка.</p><p>Дом показан с боковой гравийной дорожки. В поле зрения попадают протяжённое крыло, центральный фронтон и несколько плоскостей кровли, благодаря чему хорошо читается глубина объёма.</p><p>Сосновые стволы частично перекрывают фасад и дают ощущение присутствия в лесу. Низкая растительность и валуны смягчают границу между дорожкой и домом.</p></article><article><h2>Садовый фасад</h2><img src="/images/tour/garden-small.webp" alt="Садовый фасад. Защищённая терраса становится продолжением гостиной среди деревьев." loading="lazy"><p>Защищённая терраса становится продолжением гостиной среди деревьев.</p><p>Широкий свес кровли прикрывает террасу с мягкими креслами. Светлые каменные опоры и тёплая деревянная подшивка обрамляют место отдыха, а большие окна сохраняют связь с интерьером.</p><p>На переднем плане видны мох, папоротники и естественные камни. Сад не перекрывает архитектуру: он подходит к ней небольшими группами растений и оставляет открытыми основные виды.</p></article><article><h2>Вечерний двор</h2><img src="/images/tour/courtyard-small.webp" alt="Вечерний двор. Тёплые окна и невысокие светильники меняют настроение знакомого фасада." loading="lazy"><p>Тёплые окна и невысокие светильники меняют настроение знакомого фасада.</p><p>В сумерках центральный вход и окна становятся основными световыми акцентами. Низкая подсветка отмечает край дорожки и отдельные растения, сохраняя большую часть леса в полутени.</p><p>Небольшая площадка с креслами расположена перед домом, среди посадок и камней. Такой ракурс показывает вечернюю атмосферу двора и фактуру камня в мягком боковом свете.</p></article><article><h2>Крытая терраса</h2><img src="/images/tour/terrace-small.webp" alt="Крытая терраса. Большой стол, мягкая зона и свет гостиной — отдых продолжается снаружи." loading="lazy"><p>Большой стол, мягкая зона и свет гостиной — отдых продолжается снаружи.</p><p>Под деревянной подшивкой кровли расположены обеденный стол и плетёные кресла. За ними видна мягкая зона отдыха; широкий настил даёт достаточно места для свободного прохода.</p><p>Раздвижное остекление связывает террасу с гостиной, где читается камин. Каменная стена и тонкие тёмные опоры продолжают материалы фасада, а закатный свет проходит между соснами.</p></article><article><h2>Гостиная</h2><img src="/images/tour/living-small.webp" alt="Гостиная. Светлый диван, фактурный камин и панорамное окно в сосновый лес." loading="lazy"><p>Светлый диван, фактурный камин и панорамное окно в сосновый лес.</p><p>Мягкая угловая группа занимает центр комнаты и обращена к массивному каменному камину. Низкий журнальный стол и тканый ковёр объединяют мебель, оставляя свободный проход вдоль окна.</p><p>Стеклянная стена показывает лес почти на всю высоту помещения. Деревянный потолок, льняные ткани и шероховатый светлый камень создают тёплую, спокойную палитру.</p></article><article><h2>Прихожая</h2><img src="/images/tour/arrival-small.webp" alt="Прихожая. Деревянная дверь, длинная скамья и первый взгляд на камин в гостиной." loading="lazy"><p>Деревянная дверь, длинная скамья и первый взгляд на камин в гостиной.</p><p>Высокая деревянная дверь стоит между узкими стеклянными участками. Свет проходит вдоль входа и ложится на каменный пол. Сбоку расположена длинная встроенная скамья с небольшой нишей и мягкой подсветкой.</p><p>Широкий проход раскрывает соседнюю гостиную и каменный камин. Деревянный потолок объединяет помещения, а спокойная отделка оставляет входную зону свободной от лишних предметов.</p></article><article><h2>Столовая</h2><img src="/images/tour/dining-small.webp" alt="Столовая. Овальный деревянный стол и мягкие кресла рядом с окнами в лес." loading="lazy"><p>Овальный деревянный стол и мягкие кресла рядом с окнами в лес.</p><p>Обеденная группа стоит вдоль большого окна: овальный стол собирает кресла с мягкой светлой обивкой. Узкий подвесной светильник повторяет вытянутую линию столешницы и не перекрывает вид.</p><p>Через широкий проём видна кухня, поэтому две зоны воспринимаются как связанные пространства. Деревянный потолок и спокойный каменный пол продолжают отделку соседних комнат.</p></article><article><h2>Кухня</h2><img src="/images/tour/kitchen-small.webp" alt="Кухня. Каменный остров и деревянные фасады в естественном свете." loading="lazy"><p>Каменный остров и деревянные фасады в естественном свете.</p><p>Остров с каменной облицовкой формирует рабочий центр кухни. На нём расположены мойка с тёмным смесителем и рабочая поверхность; рядом остаётся место для подготовки продуктов.</p><p>Деревянные шкафы и линейная подсветка организуют основную стену. Большое окно делает лес главным фоном кухни, а сдержанная палитра материалов связывает её с гостиной и столовой.</p></article><article><h2>Спальня</h2><img src="/images/tour/bedroom-small.webp" alt="Спальня. Низкая кровать, мягкий текстиль и большое окно без лишнего декора." loading="lazy"><p>Низкая кровать, мягкий текстиль и большое окно без лишнего декора.</p><p>Кровать со спокойным светлым бельём расположена у деревянной стены. Прикроватные поверхности и локальный свет оставляют вокруг неё достаточно свободного пространства.</p><p>Широкий оконный проём показывает сосновые кроны. Каменный участок стены, дерево и тканый ковёр поддерживают материальную палитру дома, а приглушённые оттенки делают комнату визуально тихой.</p></article><article><h2>Гостевая спальня</h2><img src="/images/tour/guest-small.webp" alt="Гостевая спальня. Отдельная спальня с мягким оливковым акцентом и креслом у окна." loading="lazy"><p>Отдельная спальня с мягким оливковым акцентом и креслом у окна.</p><p>Двуспальная кровать дополнена простыми деревянными тумбами и направленными светильниками. Оливковый плед и тканый ковёр добавляют цвет к светлой отделке, не перегружая комнату.</p><p>В углу у панорамного окна стоит кресло с небольшим столиком. Скатный деревянный потолок и каменный фрагмент стены продолжают архитектуру дома; за стеклом видны сосны и лесная поверхность.</p></article><article><h2>Детская</h2><img src="/images/tour/playroom-small.webp" alt="Детская. Место для игр, занятий и чтения на широкой скамье у окна." loading="lazy"><p>Место для игр, занятий и чтения на широкой скамье у окна.</p><p>Низкие столы и стулья расположены рядом с открытым стеллажом. На полках — книги и игрушки, а центр комнаты занимает мягкий круглый ковёр с деревянными игровыми предметами.</p><p>Под высоким окном устроена широкая скамья с подушками. Деревянный скатный потолок, спокойные зелёные и охристые акценты делают комнату частью общего интерьера, сохраняя её игровой характер.</p></article><article><h2>Кабинет</h2><img src="/images/tour/study-small.webp" alt="Кабинет. Большой стол, книжные полки и лес за стеклом." loading="lazy"><p>Большой стол, книжные полки и лес за стеклом.</p><p>Деревянный письменный стол стоит перед панорамным окном. Рядом — рабочее кресло и настольная лампа; на поверхности достаточно свободного места для повседневных задач.</p><p>Встроенные полки занимают боковую стену. Их тёплая подсветка подчёркивает книги и каменную фактуру, создавая более камерное настроение, чем в общих комнатах.</p></article><article><h2>Библиотека</h2><img src="/images/tour/library-small.webp" alt="Библиотека. Оливковое кресло и мягкий пуф у окна — место для долгого чтения." loading="lazy"><p>Оливковое кресло и мягкий пуф у окна — место для долгого чтения.</p><p>Высокий книжный стеллаж занимает одну стену, оставляя окно свободным. Перед стеклом стоит глубокое кресло, рядом — кожаный пуф и небольшой светлый столик.</p><p>Напольная лампа создаёт локальный свет, а ковёр отделяет зону чтения от каменного пола. Деревянный потолок и спокойные натуральные оттенки поддерживают камерную атмосферу.</p></article><article><h2>Гардеробная</h2><img src="/images/tour/closet-small.webp" alt="Гардеробная. Открытые деревянные секции, мягкая подсветка и остров для хранения." loading="lazy"><p>Открытые деревянные секции, мягкая подсветка и остров для хранения.</p><p>По периметру расположены секции для одежды, полки и выдвижные ящики. Встроенная подсветка выделяет внутренние поверхности шкафов и помогает видеть их содержимое.</p><p>Невысокий остров в центре даёт дополнительную поверхность для вещей. Узкое окно в торце добавляет дневной свет, а каменный пол связывает гардеробную с остальными помещениями.</p></article><article><h2>Ванная</h2><img src="/images/tour/bath-small.webp" alt="Ванная. Отдельно стоящая ванна и стеклянная душевая рядом с лесом." loading="lazy"><p>Отдельно стоящая ванна и стеклянная душевая рядом с лесом.</p><p>Тёмная овальная ванна расположена у панорамного окна. Рядом находится душевая зона со стеклянной перегородкой; дерево тумбы и мягкая подсветка зеркала смягчают каменную отделку.</p><p>Сочетание тёмных стен, тёплого света и прозрачного стекла создаёт камерное пространство. За окном видны сосны, которые становятся главным природным акцентом комнаты.</p></article><article><h2>Спа-зона</h2><img src="/images/tour/spa-small.webp" alt="Спа-зона. Купель и сауна в спокойном пространстве с большим окном." loading="lazy"><p>Купель и сауна в спокойном пространстве с большим окном.</p><p>Каменная купель расположена рядом с дверью в сауну. Через стекло видны деревянные полки и тёплый свет; большая оконная ниша открывает лесной вид.</p><p>Светлая отделка стен и пола, деревянные потолочные элементы и немногочисленные предметы оставляют пространство свободным. Композиция строится на сочетании воды, дерева и естественного света.</p></article><article><h2>Зал для занятий</h2><img src="/images/tour/wellness-small.webp" alt="Зал для занятий. Реформер, гимнастическая стенка и свободное место для растяжки." loading="lazy"><p>Реформер, гимнастическая стенка и свободное место для растяжки.</p><p>Тренажёр с деревянной рамой расположен перед большим окном. Сбоку закреплена гимнастическая стенка; рядом лежат коврик и компактный инвентарь. Центр комнаты остаётся открытым для движения.</p><p>Деревянный потолок и светлые стены продолжают общую палитру дома. Естественный свет показывает фактуры, а сосновый лес становится спокойным фоном для занятий.</p></article><article><h2>Зона медитации</h2><img src="/images/tour/meditation-small.webp" alt="Зона медитации. Две подушки на деревянном подиуме перед окном в сосны." loading="lazy"><p>Две подушки на деревянном подиуме перед окном в сосны.</p><p>Небольшой подиум поднят над основным полом. На нём расположены две круглые подушки и низкая чаша; других предметов в центральной зоне почти нет.</p><p>Лёгкая штора, дерево и светлая штукатурка смягчают утренний свет. Растение в керамическом кашпо дополняет лес за стеклом, сохраняя ощущение простора и тишины.</p></article><article><h2>Гостевой санузел</h2><img src="/images/tour/toilet-small.webp" alt="Гостевой санузел. Каменная раковина, круглое зеркало и тёплый настенный свет." loading="lazy"><p>Каменная раковина, круглое зеркало и тёплый настенный свет.</p><p>В кадре показана умывальная часть гостевого санузла. Массивная каменная столешница опирается на открытую консоль, где размещены полотенца и корзины.</p><p>Круглое зеркало и небольшой настенный светильник смягчают грубую фактуру кладки. Деревянная дверь и высокое окно продолжают сочетание натуральных материалов, знакомое по остальному дому.</p></article><article><h2>Гараж</h2><img src="/images/tour/garage-small.webp" alt="Гараж. Место для автомобиля, велосипедов и аккуратного хранения." loading="lazy"><p>Место для автомобиля, велосипедов и аккуратного хранения.</p><p>Автомобиль занимает одну сторону помещения, оставляя свободный проход к воротам и шкафам. На стене видны велосипеды и зарядное устройство; закрытые деревянные секции собирают хозяйственное хранение.</p><p>Открытые секционные ворота показывают подъезд среди сосен. Линейный потолочный свет и ровный пол помогают читать пространство, а каменная стена связывает утилитарную зону с архитектурой дома.</p></article><a href="/doma/">Вернуться к домам</a></main></noscript>

Объём в перспективе","label":"Передний боковой ракурс","lead":"Скатная кровля, каменные опоры и остекление складываются в единый силуэт.","paragraphs":["С диагонального ракурса видны глубина дома и сопряжение кровель. Центральная входная часть выступает вперёд, а остеклённое жилое крыло вытягивается вдоль леса.","Вертикальная обшивка мягко меняет оттенок на солнце. Каменные участки у основания и между окнами создают устойчивый ритм, а прозрачные плоскости облегчают протяжённый фасад."],"features":["Диагональный вид на фасад","Сопряжение скатных кровель","Каменные опоры между окнами"],"src":"/images/orbit-1.webp","small":"/images/tour/orbit-1-small.webp","smallWidth":960,"thumb":"/images/tour/orbit-1-thumb.webp","width":1600,"height":900,"alt":"Передний боковой ракурс. Скатная кровля, каменные опоры и остекление складываются в единый силуэт."},{"id":"orbit-2","group":"outside","title":"Окна в лес","label":"Боковой фасад","lead":"Протяжённое остекление показывает, как жилые комнаты связаны с участком.","paragraphs":["Большие окна занимают значительную часть длинного фасада. За стеклом видны светильники и мебель, а отражения сосен объединяют интерьер с окружающим лесом.","Над остеклением проходит спокойная линия тёмной кровли. Светлый каменный цоколь и деревянная обшивка торца удерживают общую материальную палитру дома."],"features":["Длинная линия остекления","Деревянный торец","Каменное основание"],"src":"/images/orbit-2.webp","small":"/images/tour/orbit-2-small.webp","smallWidth":960,"thumb":"/images/tour/orbit-2-thumb.webp","width":1600,"height":900,"alt":"Боковой фасад. Протяжённое остекление показывает, как жилые комнаты связаны с участком."},{"id":"orbit-3","group":"outside","title":"Жизнь выходит наружу","label":"Терраса у гостиной","lead":"Деревянный настил продолжает жилое пространство вдоль стеклянного фасада.","paragraphs":["Угловой ракурс раскрывает остеклённую гостиную и широкую террасу. Настил огибает жилой объём и создаёт место для спокойного отдыха рядом с домом.","Под фронтоном стекло поднимается выше обычного оконного проёма. Тёмные переплёты подчёркивают геометрию, а тон кровли перекликается с затенёнными участками леса."],"features":["Остекление под фронтоном","Деревянная терраса","Связь гостиной с участком"],"src":"/images/orbit-3.webp","small":"/images/tour/orbit-3-small.webp","smallWidth":960,"thumb":"/images/tour/orbit-3-thumb.webp","width":1600,"height":900,"alt":"Терраса у гостиной. Деревянный настил продолжает жилое пространство вдоль стеклянного фасада."},{"id":"orbit-4","group":"outside","title":"Открытый двор","label":"Со стороны террасы","lead":"Широкая площадка перед домом собирает зоны отдыха под открытым небом.","paragraphs":["Этот вид показывает фасад со стороны большой деревянной террасы. На ней расположена мягкая уличная мебель; остеклённые помещения открываются прямо к общей площадке.","Центральный фронтон остаётся композиционной опорой, а боковые крылья формируют спокойный фон. Между террасой и лесом сохранены камни и низкая растительность."],"features":["Общая терраса","Уличная мебель","Лесное окружение"],"src":"/images/orbit-4.webp","small":"/images/tour/orbit-4-small.webp","smallWidth":960,"thumb":"/images/tour/orbit-4-thumb.webp","width":1600,"height":900,"alt":"Со стороны террасы. Широкая площадка перед домом собирает зоны отдыха под открытым небом."},{"id":"orbit-5","group":"outside","title":"Линии и свет","label":"Противоположный угол","lead":"Несколько объёмов читаются отдельно, сохраняя общий характер дома.","paragraphs":["С этого угла особенно заметны разные направления скатов и чередование камня, дерева и стекла. Прозрачный фронтон жилой части соседствует с более закрытым деревянным объёмом.","Вечерний свет выделяет фактуру облицовки. Перед домом остаётся естественная лесная поверхность с валунами и папоротниками, без крупной сплошной площадки мощения."],"features":["Пересечение скатов","Контраст прозрачных и глухих стен","Естественный ландшафт"],"src":"/images/orbit-5.webp","small":"/images/tour/orbit-5-small.webp","smallWidth":960,"thumb":"/images/tour/orbit-5-thumb.webp","width":1600,"height":900,"alt":"Противоположный угол. Несколько объёмов читаются отдельно, сохраняя общий характер дома."},{"id":"orbit-6","group":"outside","title":"Свет из гостиной","label":"Остеклённый фронтон","lead":"Высокое окно делает внутреннее пространство частью вечернего фасада.","paragraphs":["Главный акцент кадра — стеклянная плоскость под центральным фронтоном. Через неё видны гостиная и тёплый свет внутри дома. Широкие ступени направляют движение к остеклённой части.","По сторонам расположены более низкие крылья с большими окнами. Каменное основание и деревянная обшивка сохраняют общий язык архитектуры, а сосны создают вертикальный передний план."],"features":["Высокое центральное остекление","Тёплый свет внутри","Широкие наружные ступени"],"src":"/images/orbit-6.webp","small":"/images/tour/orbit-6-small.webp","smallWidth":960,"thumb":"/images/tour/orbit-6-thumb.webp","width":1600,"height":900,"alt":"Остеклённый фронтон. Высокое окно делает внутреннее пространство частью вечернего фасада."},{"id":"orbit-7","group":"outside","title":"Тихая сторона","label":"Вид с дорожки сбоку","lead":"Гравий, древесина и камень поддерживают естественный характер участка.","paragraphs":["Дом показан с боковой гравийной дорожки. В поле зрения попадают протяжённое крыло, центральный фронтон и несколько плоскостей кровли, благодаря чему хорошо читается глубина объёма.","Сосновые стволы частично перекрывают фасад и дают ощущение присутствия в лесу. Низкая растительность и валуны смягчают границу между дорожкой и домом."],"features":["Боковая дорожка","Несколько объёмов под скатной кровлей","Сохранённые сосны"],"src":"/images/orbit-7.webp","small":"/images/tour/orbit-7-small.webp","smallWidth":960,"thumb":"/images/tour/orbit-7-thumb.webp","width":1600,"height":900,"alt":"Вид с дорожки сбоку. Гравий, древесина и камень поддерживают естественный характер участка."},{"id":"garden","group":"outside","title":"Дом со стороны сада","label":"Садовый фасад","lead":"Защищённая терраса становится продолжением гостиной среди деревьев.","paragraphs":["Широкий свес кровли прикрывает террасу с мягкими креслами. Светлые каменные опоры и тёплая деревянная подшивка обрамляют место отдыха, а большие окна сохраняют связь с интерьером.","На переднем плане видны мох, папоротники и естественные камни. Сад не перекрывает архитектуру: он подходит к ней небольшими группами растений и оставляет открытыми основные виды."],"features":["Терраса под свесом","Каменные опоры","Лесной сад перед домом"],"src":"/images/tour/garden.webp","small":"/images/tour/garden-small.webp","smallWidth":960,"thumb":"/images/tour/garden-thumb.webp","width":1672,"height":941,"alt":"Садовый фасад. Защищённая терраса становится продолжением гостиной среди деревьев."},{"id":"courtyard","group":"outside","title":"Когда зажигается дом","label":"Вечерний двор","lead":"Тёплые окна и невысокие светильники меняют настроение знакомого фасада.","paragraphs":["В сумерках центральный вход и окна становятся основными световыми акцентами. Низкая подсветка отмечает край дорожки и отдельные растения, сохраняя большую часть леса в полутени.","Небольшая площадка с креслами расположена перед домом, среди посадок и камней. Такой ракурс показывает вечернюю атмосферу двора и фактуру камня в мягком боковом свете."],"features":["Вечернее освещение фасада","Кресла во дворе","Низкие светильники у дорожки"],"src":"/images/tour/courtyard.webp","small":"/images/tour/courtyard-small.webp","smallWidth":960,"thumb":"/images/tour/courtyard-thumb.webp","width":1672,"height":941,"alt":"Вечерний двор. Тёплые окна и невысокие светильники меняют настроение знакомого фасада."},{"id":"terrace","group":"outside","title":"Ужин под соснами","label":"Крытая терраса","lead":"Большой стол, мягкая зона и свет гостиной — отдых продолжается снаружи.","paragraphs":["Под деревянной подшивкой кровли расположены обеденный стол и плетёные кресла. За ними видна мягкая зона отдыха; широкий настил даёт достаточно места для свободного прохода.","Раздвижное остекление связывает террасу с гостиной, где читается камин. Каменная стена и тонкие тёмные опоры продолжают материалы фасада, а закатный свет проходит между соснами."],"features":["Обеденная и мягкая зоны","Деревянная подшивка и настил","Остекление между террасой и гостиной"],"src":"/images/tour/terrace.webp","small":"/images/tour/terrace-small.webp","smallWidth":960,"thumb":"/images/tour/terrace-thumb.webp","width":1672,"height":941,"alt":"Крытая терраса. Большой стол, мягкая зона и свет гостиной — отдых продолжается снаружи."},{"id":"living","group":"inside","title":"У огня и леса","label":"Гостиная","lead":"Светлый диван, фактурный камин и панорамное окно в сосновый лес.","paragraphs":["Мягкая угловая группа занимает центр комнаты и обращена к массивному каменному камину. Низкий журнальный стол и тканый ковёр объединяют мебель, оставляя свободный проход вдоль окна.","Стеклянная стена показывает лес почти на всю высоту помещения. Деревянный потолок, льняные ткани и шероховатый светлый камень создают тёплую, спокойную палитру."],"features":["Камин из светлого камня","Угловой диван и низкий стол","Панорамное остекление"],"src":"/images/living.webp","small":"/images/tour/living-small.webp","smallWidth":960,"thumb":"/images/tour/living-thumb.webp","width":1600,"height":900,"alt":"Гостиная. Светлый диван, фактурный камин и панорамное окно в сосновый лес."},{"id":"arrival","group":"inside","title":"С порога — спокойно","label":"Прихожая","lead":"Деревянная дверь, длинная скамья и первый взгляд на камин в гостиной.","paragraphs":["Высокая деревянная дверь стоит между узкими стеклянными участками. Свет проходит вдоль входа и ложится на каменный пол. Сбоку расположена длинная встроенная скамья с небольшой нишей и мягкой подсветкой.","Широкий проход раскрывает соседнюю гостиную и каменный камин. Деревянный потолок объединяет помещения, а спокойная отделка оставляет входную зону свободной от лишних предметов."],"features":["Входная дверь с боковым остеклением","Скамья в освещённой нише","Открытый проход в гостиную"],"src":"/images/tour/arrival.webp","small":"/images/tour/arrival-small.webp","smallWidth":960,"thumb":"/images/tour/arrival-thumb.webp","width":1672,"height":941,"alt":"Прихожая. Деревянная дверь, длинная скамья и первый взгляд на камин в гостиной."},{"id":"dining","group":"inside","title":"Время за общим столом","label":"Столовая","lead":"Овальный деревянный стол и мягкие кресла рядом с окнами в лес.","paragraphs":["Обеденная группа стоит вдоль большого окна: овальный стол собирает кресла с мягкой светлой обивкой. Узкий подвесной светильник повторяет вытянутую линию столешницы и не перекрывает вид.","Через широкий проём видна кухня, поэтому две зоны воспринимаются как связанные пространства. Деревянный потолок и спокойный каменный пол продолжают отделку соседних комнат."],"features":["Овальный стол","Мягкие обеденные кресла","Открытый проход к кухне"],"src":"/images/tour/dining.webp","small":"/images/tour/dining-small.webp","smallWidth":960,"thumb":"/images/tour/dining-thumb.webp","width":1672,"height":941,"alt":"Столовая. Овальный деревянный стол и мягкие кресла рядом с окнами в лес."},{"id":"kitchen","group":"inside","title":"Утро у большого окна","label":"Кухня","lead":"Каменный остров и деревянные фасады в естественном свете.","paragraphs":["Остров с каменной облицовкой формирует рабочий центр кухни. На нём расположены мойка с тёмным смесителем и рабочая поверхность; рядом остаётся место для подготовки продуктов.","Деревянные шкафы и линейная подсветка организуют основную стену. Большое окно делает лес главным фоном кухни, а сдержанная палитра материалов связывает её с гостиной и столовой."],"features":["Каменный кухонный остров","Деревянные шкафы","Линейная подсветка рабочей стены"],"src":"/images/kitchen.webp","small":"/images/tour/kitchen-small.webp","smallWidth":960,"thumb":"/images/tour/kitchen-thumb.webp","width":1600,"height":900,"alt":"Кухня. Каменный остров и деревянные фасады в естественном свете."},{"id":"bedroom","group":"inside","title":"Просыпаться с видом на лес","label":"Спальня","lead":"Низкая кровать, мягкий текстиль и большое окно без лишнего декора.","paragraphs":["Кровать со спокойным светлым бельём расположена у деревянной стены. Прикроватные поверхности и локальный свет оставляют вокруг неё достаточно свободного пространства.","Широкий оконный проём показывает сосновые кроны. Каменный участок стены, дерево и тканый ковёр поддерживают материальную палитру дома, а приглушённые оттенки делают комнату визуально тихой."],"features":["Деревянная стена у изголовья","Светлый текстиль","Широкое окно в лес"],"src":"/images/bedroom.webp","small":"/images/tour/bedroom-small.webp","smallWidth":960,"thumb":"/images/tour/bedroom-thumb.webp","width":1600,"height":900,"alt":"Спальня. Низкая кровать, мягкий текстиль и большое окно без лишнего декора."},{"id":"guest","group":"inside","title":"Остаться на выходные","label":"Гостевая спальня","lead":"Отдельная спальня с мягким оливковым акцентом и креслом у окна.","paragraphs":["Двуспальная кровать дополнена простыми деревянными тумбами и направленными светильниками. Оливковый плед и тканый ковёр добавляют цвет к светлой отделке, не перегружая комнату.","В углу у панорамного окна стоит кресло с небольшим столиком. Скатный деревянный потолок и каменный фрагмент стены продолжают архитектуру дома; за стеклом видны сосны и лесная поверхность."],"features":["Двуспальная кровать","Кресло у панорамного окна","Скатный деревянный потолок"],"src":"/images/tour/guest.webp","small":"/images/tour/guest-small.webp","smallWidth":960,"thumb":"/images/tour/guest-thumb.webp","width":1672,"height":941,"alt":"Гостевая спальня. Отдельная спальня с мягким оливковым акцентом и креслом у окна."},{"id":"playroom","group":"inside","title":"Комната для открытий","label":"Детская","lead":"Место для игр, занятий и чтения на широкой скамье у окна.","paragraphs":["Низкие столы и стулья расположены рядом с открытым стеллажом. На полках — книги и игрушки, а центр комнаты занимает мягкий круглый ковёр с деревянными игровыми предметами.","Под высоким окном устроена широкая скамья с подушками. Деревянный скатный потолок, спокойные зелёные и охристые акценты делают комнату частью общего интерьера, сохраняя её игровой характер."],"features":["Низкая мебель для занятий","Ковёр и деревянные игрушки","Скамья для чтения у окна"],"src":"/images/tour/playroom.webp","small":"/images/tour/playroom-small.webp","smallWidth":960,"thumb":"/images/tour/playroom-thumb.webp","width":1672,"height":941,"alt":"Детская. Место для игр, занятий и чтения на широкой скамье у окна."},{"id":"study","group":"inside","title":"Работать в своём ритме","label":"Кабинет","lead":"Большой стол, книжные полки и лес за стеклом.","paragraphs":["Деревянный письменный стол стоит перед панорамным окном. Рядом — рабочее кресло и настольная лампа; на поверхности достаточно свободного места для повседневных задач.","Встроенные полки занимают боковую стену. Их тёплая подсветка подчёркивает книги и каменную фактуру, создавая более камерное настроение, чем в общих комнатах."],"features":["Деревянный рабочий стол","Книжные полки с подсветкой","Локальный свет"],"src":"/images/study.webp","small":"/images/tour/study-small.webp","smallWidth":960,"thumb":"/images/tour/study-thumb.webp","width":1600,"height":900,"alt":"Кабинет. Большой стол, книжные полки и лес за стеклом."},{"id":"library","group":"inside","title":"Ещё одна глава","label":"Библиотека","lead":"Оливковое кресло и мягкий пуф у окна — место для долгого чтения.","paragraphs":["Высокий книжный стеллаж занимает одну стену, оставляя окно свободным. Перед стеклом стоит глубокое кресло, рядом — кожаный пуф и небольшой светлый столик.","Напольная лампа создаёт локальный свет, а ковёр отделяет зону чтения от каменного пола. Деревянный потолок и спокойные натуральные оттенки поддерживают камерную атмосферу."],"features":["Высокий книжный стеллаж","Кресло с пуфом","Напольная лампа и столик"],"src":"/images/tour/library.webp","small":"/images/tour/library-small.webp","smallWidth":960,"thumb":"/images/tour/library-thumb.webp","width":1672,"height":941,"alt":"Библиотека. Оливковое кресло и мягкий пуф у окна — место для долгого чтения."},{"id":"closet","group":"inside","title":"У каждой вещи своё место","label":"Гардеробная","lead":"Открытые деревянные секции, мягкая подсветка и остров для хранения.","paragraphs":["По периметру расположены секции для одежды, полки и выдвижные ящики. Встроенная подсветка выделяет внутренние поверхности шкафов и помогает видеть их содержимое.","Невысокий остров в центре даёт дополнительную поверхность для вещей. Узкое окно в торце добавляет дневной свет, а каменный пол связывает гардеробную с остальными помещениями."],"features":["Секции с одеждой и полками","Центральный остров","Встроенная подсветка"],"src":"/images/closet.webp","small":"/images/tour/closet-small.webp","smallWidth":960,"thumb":"/images/tour/closet-thumb.webp","width":1600,"height":900,"alt":"Гардеробная. Открытые деревянные секции, мягкая подсветка и остров для хранения."},{"id":"bath","group":"inside","title":"Вода, камень, тишина","label":"Ванная","lead":"Отдельно стоящая ванна и стеклянная душевая рядом с лесом.","paragraphs":["Тёмная овальная ванна расположена у панорамного окна. Рядом находится душевая зона со стеклянной перегородкой; дерево тумбы и мягкая подсветка зеркала смягчают каменную отделку.","Сочетание тёмных стен, тёплого света и прозрачного стекла создаёт камерное пространство. За окном видны сосны, которые становятся главным природным акцентом комнаты."],"features":["Отдельно стоящая ванна","Душевая за стеклом","Деревянная тумба под раковиной"],"src":"/images/bath.webp","small":"/images/tour/bath-small.webp","smallWidth":960,"thumb":"/images/tour/bath-thumb.webp","width":1600,"height":900,"alt":"Ванная. Отдельно стоящая ванна и стеклянная душевая рядом с лесом."},{"id":"spa","group":"inside","title":"Пауза в собственном доме","label":"Спа-зона","lead":"Купель и сауна в спокойном пространстве с большим окном.","paragraphs":["Каменная купель расположена рядом с дверью в сауну. Через стекло видны деревянные полки и тёплый свет; большая оконная ниша открывает лесной вид.","Светлая отделка стен и пола, деревянные потолочные элементы и немногочисленные предметы оставляют пространство свободным. Композиция строится на сочетании воды, дерева и естественного света."],"features":["Каменная купель","Сауна за стеклянной дверью","Большая оконная ниша"],"src":"/images/spa.webp","small":"/images/tour/spa-small.webp","smallWidth":960,"thumb":"/images/tour/spa-thumb.webp","width":1600,"height":900,"alt":"Спа-зона. Купель и сауна в спокойном пространстве с большим окном."},{"id":"wellness","group":"inside","title":"Движение без спешки","label":"Зал для занятий","lead":"Реформер, гимнастическая стенка и свободное место для растяжки.","paragraphs":["Тренажёр с деревянной рамой расположен перед большим окном. Сбоку закреплена гимнастическая стенка; рядом лежат коврик и компактный инвентарь. Центр комнаты остаётся открытым для движения.","Деревянный потолок и светлые стены продолжают общую палитру дома. Естественный свет показывает фактуры, а сосновый лес становится спокойным фоном для занятий."],"features":["Реформер с деревянной рамой","Гимнастическая стенка","Коврик и компактный инвентарь"],"src":"/images/tour/wellness.webp","small":"/images/tour/wellness-small.webp","smallWidth":960,"thumb":"/images/tour/wellness-thumb.webp","width":1672,"height":941,"alt":"Зал для занятий. Реформер, гимнастическая стенка и свободное место для растяжки."},{"id":"meditation","group":"inside","title":"Несколько минут для себя","label":"Зона медитации","lead":"Две подушки на деревянном подиуме перед окном в сосны.","paragraphs":["Небольшой подиум поднят над основным полом. На нём расположены две круглые подушки и низкая чаша; других предметов в центральной зоне почти нет.","Лёгкая штора, дерево и светлая штукатурка смягчают утренний свет. Растение в керамическом кашпо дополняет лес за стеклом, сохраняя ощущение простора и тишины."],"features":["Деревянный подиум","Две подушки для медитации","Лёгкая штора и естественный свет"],"src":"/images/tour/meditation.webp","small":"/images/tour/meditation-small.webp","smallWidth":960,"thumb":"/images/tour/meditation-thumb.webp","width":1672,"height":941,"alt":"Зона медитации. Две подушки на деревянном подиуме перед окном в сосны."},{"id":"toilet","group":"inside","title":"Маленькое пространство с характером","label":"Гостевой санузел","lead":"Каменная раковина, круглое зеркало и тёплый настенный свет.","paragraphs":["В кадре показана умывальная часть гостевого санузла. Массивная каменная столешница опирается на открытую консоль, где размещены полотенца и корзины.","Круглое зеркало и небольшой настенный светильник смягчают грубую фактуру кладки. Деревянная дверь и высокое окно продолжают сочетание натуральных материалов, знакомое по остальному дому."],"features":["Каменная раковина на консоли","Круглое зеркало","Открытая полка для полотенец"],"src":"/images/toilet.webp","small":"/images/tour/toilet-small.webp","smallWidth":960,"thumb":"/images/tour/toilet-thumb.webp","width":1600,"height":900,"alt":"Гостевой санузел. Каменная раковина, круглое зеркало и тёплый настенный свет."},{"id":"garage","group":"inside","title":"Порядок начинается у въезда","label":"Гараж","lead":"Место для автомобиля, велосипедов и аккуратного хранения.","paragraphs":["Автомобиль занимает одну сторону помещения, оставляя свободный проход к воротам и шкафам. На стене видны велосипеды и зарядное устройство; закрытые деревянные секции собирают хозяйственное хранение.","Открытые секционные ворота показывают подъезд среди сосен. Линейный потолочный свет и ровный пол помогают читать пространство, а каменная стена связывает утилитарную зону с архитектурой дома."],"features":["Автомобиль и свободный проход","Хранение велосипедов","Шкафы и настенная зарядка"],"src":"/images/tour/garage.webp","small":"/images/tour/garage-small.webp","smallWidth":960,"thumb":"/images/tour/garage-thumb.webp","width":1672,"height":941,"alt":"Гараж. Место для автомобиля, велосипедов и аккуратного хранения."}]</script>
