<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SHERWOOD · 3D-тур</title>
<meta name="theme-color" content="#0B0B0C"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="preload" as="image" href="images/house-front.webp"/>
<link rel="preload" as="image" href="images/house.webp"/>
<link rel="preload" as="video" href="videos/window.mp4"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Manrope:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0b0b0c;--fg:#f4efe6;--muted:#a39a8c;--accent:#c4a574;--line:rgba(244,239,230,.12);--ink:#0b0b0c;--serif:"Cormorant Garamond",Georgia,serif;--sans:Manrope,system-ui,sans-serif;--gutter:8vw}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.track{height:2000vh}
.tour-scrub{position:absolute;left:0;right:0;bottom:0;z-index:22;height:2px;background:rgba(244,239,230,.1);pointer-events:none}
.tour-scrub i{display:block;height:100%;width:100%;transform-origin:left center;transform:scaleX(0);background:var(--accent)}
.stage{position:sticky;top:0;height:100dvh;width:100%;overflow:hidden;background:#0b0b0c;perspective:1600px;perspective-origin:50% 46%}
.orbit-stage,.orbit-face,.fly-plane,.dive-film{position:absolute;inset:0}
.orbit-stage{z-index:2;transform-style:preserve-3d}
.orbit-rig{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:50% 46%}
.orbit-face{backface-visibility:hidden;overflow:hidden}
.orbit-face img{filter:brightness(var(--wall-diff,1));object-position:var(--wall-parx,50%) var(--wall-pary,50%)}
.wall-shader{position:absolute;inset:0;pointer-events:none;z-index:2}
.wall-fresnel,.wall-rim,.wall-glass,.wall-cad{position:absolute;inset:0}
.wall-fresnel{opacity:var(--wall-fres,0);background:linear-gradient(90deg,rgba(12,14,16,.28),transparent 38%,rgba(232,224,210,.18) 72%,rgba(196,165,116,.42));mix-blend-mode:screen}
.wall-rim{opacity:var(--wall-rim,0);box-shadow:inset -4.5rem 0 7rem rgba(196,165,116,.28),inset 3.5rem 0 5rem rgba(8,10,12,.45);mix-blend-mode:overlay}
.wall-spec{position:absolute;width:var(--wall-spec-size,28%);height:calc(var(--wall-spec-size,28%)*0.62);left:var(--wall-spec-x,58%);top:var(--wall-spec-y,40%);transform:translate(-50%,-50%);border-radius:50%;opacity:var(--wall-spec,0);background:radial-gradient(ellipse,rgba(255,246,220,.8),rgba(196,165,116,.25) 38%,transparent 70%);filter:blur(var(--wall-spec-blur,18px));mix-blend-mode:screen}
.wall-cad{opacity:var(--wall-cad,0);background-image:linear-gradient(rgba(196,165,116,.28) 1px,transparent 1px),linear-gradient(90deg,rgba(196,165,116,.28) 1px,transparent 1px);background-size:56px 56px;mix-blend-mode:screen;mask-image:linear-gradient(to right,transparent,black 22%,black 78%,transparent)}
.orbit-face img,.fly-plane img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.dive-film{z-index:4;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none}
.fly-plane{z-index:5;opacity:0}
.fly-plane .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(11,11,12,.8),transparent 50%);pointer-events:none}
.copy,.orbit-copy{position:absolute;left:var(--gutter);bottom:12vh;z-index:12;max-width:32rem;pointer-events:none}
.orbit-copy{pointer-events:none}
.window-hit{margin-top:18px;min-height:44px;border:0;background:var(--accent);color:var(--ink);padding:10px 16px;letter-spacing:.14em;text-transform:uppercase;font-size:11px;cursor:pointer;font-family:var(--sans);pointer-events:auto}
.eyebrow{color:var(--accent);letter-spacing:.22em;text-transform:uppercase;font-size:11px}
h3{font-family:var(--serif);font-weight:400;font-size:clamp(32px,5vw,60px);margin-top:8px}
.copy p,.orbit-copy p{color:var(--muted);margin-top:12px;line-height:1.7;max-width:42ch}
.window-hit{margin-top:18px;min-height:44px;border:0;background:var(--accent);color:var(--ink);padding:10px 16px;letter-spacing:.14em;text-transform:uppercase;font-size:11px;cursor:pointer;font-family:var(--sans);pointer-events:auto}
.top{position:absolute;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:22px var(--gutter);letter-spacing:.18em;text-transform:uppercase;font-size:12px}
.top a,.top button{color:var(--accent);background:none;border:0;font:inherit;letter-spacing:.18em;text-transform:uppercase;min-height:44px;cursor:pointer}
.dots{position:absolute;right:var(--gutter);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:10}
.dots i{display:block;width:1px;height:20px;background:var(--line)}
.dots i.on{background:var(--accent)}
.stage:after{content:"";position:absolute;inset:0;z-index:8;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(11,11,12,.32) 100%)}
@media(max-width:700px){.dots{display:none}.track{height:1480vh}}
</style>
</head>
<body>
<section class="track" id="track">
  <div class="stage" id="stage">
    <div class="top">
      <span>SHERWOOD · 3D-тур</span>
      <div>
        <button type="button" id="around">Вокруг дома</button>
        <a href="index.html">На сайт</a>
      </div>
    </div>
    <div class="orbit-stage" id="orbit"><div class="orbit-rig" id="rig"></div></div>
    <video class="dive-film" id="dive" muted playsinline preload="auto" poster="images/house-court.webp"><source src="videos/window.mp4" type="video/mp4"/></video>
    <div id="rooms"></div>
    <div class="orbit-copy" id="orbitCopy">
      <span class="eyebrow" id="orbitEye">Облёт дома</span>
      <h3 id="orbitTitle">Весь дом</h3>
      <p>Тяните в сторону — дом крутится вокруг. Скролл ведёт к окну.</p>
      <button class="window-hit" type="button" id="intoWindow">Залететь в окно</button>
    </div>
    <div class="tour-scrub" aria-hidden><i id="scrub"></i></div>
    <div class="dots" id="dots"></div>
  </div>
</section>
<script>
const facades=[
  {img:"images/house-front.webp"},
  {img:"images/house.webp"},
  {img:"images/house-side.webp"},
  {img:"images/house-court.webp"}
];
const rooms=[
  {p:"Гостиная",t:"Очаг",c:"Вечером огонь и лес за стеклом — будто сидите на опушке, только тепло.",img:"images/living.webp",lq:"images/living.lq.webp"},
  {p:"Кухня",t:"Ритм утра",c:"Камень острова холодный на ладонь. Завтрак — и уже виден двор.",img:"images/kitchen.webp",lq:"images/kitchen.lq.webp"},
  {p:"Спальня",t:"Тишина",c:"Здесь дом выдыхает. Утром — только лес.",img:"images/bedroom.webp",lq:"images/bedroom.lq.webp"},
  {p:"Детская",t:"Своё окно",c:"Окно в кроны, тёплый пол. Можно шуметь — стены держат.",img:"images/kids.webp",lq:"images/kids.lq.webp"},
  {p:"Кабинет",t:"Дверь мягко",c:"Стол к лесу. Здесь думается.",img:"images/study.webp",lq:"images/study.lq.webp"},
  {p:"Гардеробная",t:"Всё на местах",c:"Свет зажигается сам. Пальто, чемоданы, утро без поиска.",img:"images/closet.webp",lq:"images/closet.lq.webp"},
  {p:"Ванная",t:"Камень греет",c:"Ступни на тёплом камне, душ как дождь.",img:"images/bath.webp",lq:"images/bath.lq.webp"},
  {p:"Спа",t:"Жар и вода",c:"Сауна, вода, лес в окошке. Не отель — свой ритуал.",img:"images/spa.webp",lq:"images/spa.lq.webp"},
  {p:"Туалет",t:"Отдельно",c:"Своя комната, не совмещённая с ванной.",img:"images/toilet.webp",lq:"images/toilet.lq.webp"}
];
const cam={t:0,yaw:0,playing:false};
const vel={t:0,yaw:0};
function clamp01(n){return Math.min(1,Math.max(0,n))}
function wrap360(a){return (a%360+360)%360}
function shortest(a){return ((a+180)%360+360)%360-180}
function smootherstep(n){const x=clamp01(n);return x*x*x*(x*(x*6-15)+10)}
function smoothDamp(cur,tgt,key,st,dt){
  st=Math.max(0.0001,st); const omega=2/st, x=omega*dt, exp=1/(1+x+0.48*x*x+0.235*x*x*x);
  const change=cur-tgt, temp=(vel[key]+omega*change)*dt; vel[key]=(vel[key]-omega*temp)*exp;
  return tgt+(change+temp)*exp;
}
function smoothDampAngle(cur,tgt,key,st,dt){
  const d=shortest(tgt-cur); return wrap360(smoothDamp(cur,cur+d,key,st,dt));
}
function shotPair(progress,count,hold){
  if(count<=1)return {a:0,b:0,mix:0};
  const x=clamp01(progress)*(count-1); const i=Math.min(count-2,Math.floor(x)); const f=x-i;
  if(f<=hold)return {a:i,b:i+1,mix:0};
  return {a:i,b:i+1,mix:smootherstep((f-hold)/(1-hold))};
}
function sampleTour(t,n){
  const x=clamp01(t); let yaw,dolly,scale,layer;
  if(x<=0.3){const u=smootherstep(x/0.3); yaw=u*270; dolly=u*0.08; scale=1+u*0.04; layer=0;}
  else if(x<=0.4){const u=smootherstep((x-0.3)/0.1); yaw=270; dolly=0.08+u*0.72; scale=1.04+u*0.16; layer=u;}
  else if(x<=0.5){const u=smootherstep((x-0.4)/0.1); yaw=270; dolly=0.8+u*0.2; scale=1.2-u*0.14; layer=1+u;}
  else {yaw=270; dolly=1; const pair=shotPair((x-0.5)/0.5,n,0.64); layer=2+pair.a+pair.mix; scale=1.04+pair.mix*0.05;}
  const orbit=clamp01(1-layer);
  const dive=layer<1?clamp01(layer):clamp01(2-layer);
  const room=Math.min(n-1,Math.max(0,Math.floor(layer-2+1e-6)));
  const roomMix=clamp01((layer-2)-Math.floor(layer-2));
  const label=layer<0.45?"orbit":layer<1.45?"dive":"inside";
  return {yaw,dolly,scale,orbit,dive,room,roomMix,layer,label};
}
function roomVis(layer,i){return clamp01(1-Math.abs(layer-2-i))}
const rig=document.getElementById("rig");
const roomsEl=document.getElementById("rooms");
const dotsEl=document.getElementById("dots");
rig.innerHTML=facades.map((f)=>`<div class="orbit-face"><img src="${f.img}" alt="" width="1600" height="900"/><div class="wall-shader"><span class="wall-fresnel"></span><span class="wall-spec"></span><span class="wall-rim"></span><span class="wall-glass"></span><span class="wall-cad"></span></div></div>`).join("");
roomsEl.innerHTML=rooms.map((r,n)=>`<article class="fly-plane"><img src="${n===0?r.img:r.lq}" alt="" width="1600" height="900"/><div class="shade"></div><div class="copy"><span class="eyebrow">0${n+2} — ${r.p}</span><h3>${r.t}</h3><p>${r.c}</p></div></article>`).join("");
dotsEl.innerHTML=`<i class="on"></i>`+rooms.map(()=>`<i></i>`).join("");
const faces=[...rig.querySelectorAll(".orbit-face")];
const els=[...roomsEl.querySelectorAll(".fly-plane")];
const copies=[...roomsEl.querySelectorAll(".copy")];
const vis=[...roomsEl.querySelectorAll(".fly-plane > img")];
const dots=[...dotsEl.querySelectorAll("i")];
const dive=document.getElementById("dive");
const orbitCopy=document.getElementById("orbitCopy");
const track=document.getElementById("track");
const loaded=new Set([0,1]);
let yawOff=0,drag=null,phase="orbit";
const wallMats=[
  {roughness:0.58,metallic:0.02,f0:0.04},
  {roughness:0.64,metallic:0,f0:0.04},
  {roughness:0.52,metallic:0,f0:0.04},
  {roughness:0.08,metallic:0.05,f0:0.08}
];
function evalPbr(nv,nl,nh,mat){
  nv=Math.max(0.02,Math.abs(nv)); nl=Math.max(0.02,nl); nh=Math.max(0.02,nh);
  const a=Math.max(0.02,mat.roughness*mat.roughness), a2=a*a, d=nh*nh*(a2-1)+1;
  const D=a2/(Math.PI*d*d), k=((mat.roughness+1)**2)/8;
  const G=(nv/(nv*(1-k)+k))*(nl/(nl*(1-k)+k));
  const F=mat.f0+(1-mat.f0)*Math.pow(1-nv,5);
  const spec=Math.min(2.2,(D*G*F)/(4*nv*nl));
  const kd=(1-F)*(1-mat.metallic);
  return {diffuse:0.38+kd*nl*0.72, spec, fresnel:F, env:F*(1-mat.roughness)*(0.35+0.65*(1-nv)), blur:6+mat.roughness*48, size:14+mat.roughness*48};
}
function goTo(t){const s=track.offsetTop,e=s+track.offsetHeight-innerHeight;scrollTo({top:s+t*(e-s)})}
const scrub=document.getElementById("scrub");
function draw(t,yaw){
  const shot=sampleTour(t,rooms.length);
  phase=shot.label;
  const radius=Math.min(innerWidth,innerHeight)*0.48;
  const dolly=shot.dolly*radius*0.9;
  if(scrub) scrub.style.transform=`scaleX(${t})`;
  const orbitEl=document.getElementById("orbit");
  orbitEl.style.opacity=shot.orbit;
  orbitEl.style.transform=`scale(${shot.scale})`;
  rig.style.transform=`translateZ(${-radius+dolly}px) rotateY(${-yaw}deg)`;
  faces.forEach((el,i)=>{
    el.style.transform=`rotateY(${i*90}deg) translateZ(${radius}px)`;
    const rel=((yaw-i*90)*Math.PI)/180;
    const mat=wallMats[i]||wallMats[0];
    const pbr=evalPbr(Math.cos(rel),Math.cos(rel-0.38),Math.cos(rel-0.19),mat);
    const facing=Math.max(0,Math.cos(rel));
    el.style.opacity=0.35+0.65*facing;
    el.style.setProperty("--wall-diff",pbr.diffuse);
    el.style.setProperty("--wall-fres",pbr.fresnel*1.1);
    el.style.setProperty("--wall-rim",Math.pow(1-facing,2.2)*0.65);
    el.style.setProperty("--wall-glass",pbr.env);
    el.style.setProperty("--wall-spec",Math.min(1,pbr.spec*0.55));
    el.style.setProperty("--wall-spec-size",pbr.size+"%");
    el.style.setProperty("--wall-spec-blur",pbr.blur+"px");
    el.style.setProperty("--wall-spec-x",(50+Math.sin(rel-0.38)*28)+"%");
    el.style.setProperty("--wall-spec-y",(38+(1-facing)*8)+"%");
    el.style.setProperty("--wall-cad",Math.pow(1-facing,3)*0.4);
    el.style.setProperty("--wall-parx",(50+Math.sin(rel)*7)+"%");
    el.style.setProperty("--wall-pary",(48+(1-facing)*3)+"%");
  });
  if(dive){
    dive.style.opacity=shot.dive;
    dive.style.transform=`scale(${1.04+shot.dolly*0.08})`;
    if(shot.dive>0.22 && !cam.playing){cam.playing=true;try{dive.currentTime=0.01}catch(e){} dive.play()}
    if(shot.dive<0.04 && cam.playing){cam.playing=false;dive.pause()}
  }
  rooms.forEach((r,i)=>{
    const v=roomVis(shot.layer,i);
    if(v>0.05&&!loaded.has(i)){loaded.add(i);vis[i].src=r.img}
    els[i].style.opacity=v;
    els[i].style.transform=`scale(${1.02+v*0.05})`;
    copies[i].style.opacity=v>0.62?"1":"0";
    dots[i+1].classList.toggle("on",phase==="inside"&&((shot.roomMix>0.5?shot.room+1:shot.room)===i));
  });
  dots[0].classList.toggle("on",phase!=="inside");
  orbitCopy.style.opacity=Math.max(shot.orbit,shot.dive*0.85)*(shot.layer<1.55?1:0);
  const showBtn=shot.orbit>0.75&&shot.dive<0.12;
  document.getElementById("intoWindow").style.opacity=showBtn?1:0;
  document.getElementById("intoWindow").style.pointerEvents=showBtn?"auto":"none";
  document.getElementById("orbitEye").textContent=shot.label==="dive"?"Залёт":"Облёт дома";
  document.getElementById("orbitTitle").textContent=shot.label==="dive"?"Внутрь":"Весь дом";
}
let last=performance.now();
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  const s=track.offsetTop,e=s+track.offsetHeight-innerHeight;
  const target=Math.min(1,Math.max(0,(scrollY-s)/(e-s||1)));
  cam.t=smoothDamp(cam.t,target,"t",0.16,dt);
  const shot=sampleTour(cam.t,rooms.length);
  if(!drag && shot.layer>0.35) yawOff*=0.92;
  const spin=wrap360(shot.yaw+(shot.layer<0.5?yawOff:0));
  cam.yaw=smoothDampAngle(cam.yaw,spin,"yaw",drag?0.06:0.2,dt);
  draw(cam.t,cam.yaw);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
document.getElementById("intoWindow").onclick=()=>goTo(0.31);
document.getElementById("around").onclick=()=>goTo(0);
document.getElementById("stage").onpointerdown=e=>{if(e.target.closest("button,a"))return;if(phase!=="orbit")return;e.currentTarget.setPointerCapture(e.pointerId);drag={x:e.clientX,yaw:yawOff}};
addEventListener("pointermove",e=>{if(!drag||phase!=="orbit")return;yawOff=drag.yaw+(e.clientX-drag.x)*0.28});
addEventListener("pointerup",()=>{drag=null});
</script>
</body>
</html>
