<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SHERWOOD · 3D-тур</title>
<meta name="theme-color" content="#0B0B0C"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="preload" as="image" href="images/house.webp"/>
<link rel="preload" as="video" href="videos/window.mp4"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Manrope:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0b0b0c;--fg:#f4efe6;--muted:#a39a8c;--accent:#c4a574;--line:rgba(244,239,230,.12);--ink:#0b0b0c;--serif:"Cormorant Garamond",Georgia,serif;--sans:Manrope,system-ui,sans-serif;--gutter:8vw;--persp:1680px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.track{height:1800vh}
.stage{position:sticky;top:0;height:100dvh;overflow:hidden;perspective:var(--persp);perspective-origin:50% 46%}
.stage:after{content:"";position:absolute;inset:0;z-index:8;pointer-events:none;background:radial-gradient(ellipse at center,transparent 42%,rgba(11,11,12,.55) 100%)}
.orbit-face,.room .vis,.dive-film{position:absolute;inset:0;background-size:cover;background-position:center}
.orbit-face{z-index:2;transform-origin:50% 46%}
.dive-film{z-index:4;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none}
.room{position:absolute;inset:0;z-index:5;transform-origin:50% 48%;opacity:0}
.room .vis:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(11,11,12,.9),transparent 50%)}
.copy,.orbit-copy{position:absolute;left:var(--gutter);bottom:12vh;z-index:12;max-width:32rem}
.eyebrow{color:var(--accent);letter-spacing:.22em;text-transform:uppercase;font-size:11px}
h1,h3{font-family:var(--serif);font-weight:400}
h3{font-size:clamp(32px,5vw,60px);margin-top:8px}
.copy p,.orbit-copy p{color:var(--muted);margin-top:12px;line-height:1.7;max-width:42ch}
.window-hit{margin-top:18px;min-height:44px;border:1px solid var(--accent);background:var(--accent);color:var(--ink);padding:10px 16px;letter-spacing:.14em;text-transform:uppercase;font-size:11px;cursor:pointer;font-family:var(--sans)}
.top{position:absolute;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:22px var(--gutter);letter-spacing:.18em;text-transform:uppercase;font-size:12px}
.top a,.top button{color:var(--accent);background:none;border:0;font:inherit;letter-spacing:.18em;text-transform:uppercase;min-height:44px;cursor:pointer}
.dots{position:absolute;right:var(--gutter);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:10}
.dots i{display:block;width:1px;height:20px;background:var(--line)}
.dots i.on{background:var(--accent)}
.plan{position:absolute;right:var(--gutter);bottom:120px;z-index:12;width:min(352px,46vw);border:1px solid var(--line);background:rgba(11,11,12,.84);padding:16px}
.grid{position:relative;height:216px;border:1px solid var(--line)}
.cell{position:absolute;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:rgba(11,11,12,.35);color:var(--fg);font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;font-family:var(--sans)}
.cell.on{border-color:var(--accent);background:rgba(196,165,116,.22);color:var(--accent)}
.floors{display:flex;gap:8px;margin-bottom:12px}
.floors button,.row button{background:transparent;color:var(--accent);border:1px solid var(--line);padding:10px 12px;min-height:44px;letter-spacing:.08em;text-transform:uppercase;font-size:11px;cursor:pointer}
.floors button.on{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.hint{margin-top:8px;font-size:11px;color:var(--muted)}
@media(max-width:700px){.dots{display:none}.plan{left:16px;right:16px;width:auto;bottom:150px}.track{height:1480vh}}
</style>
</head>
<body>
<section class="track" id="track">
  <div class="stage" id="stage">
    <div class="top">
      <span>SHERWOOD · 3D-тур</span>
      <div>
        <button type="button" id="around">Вокруг дома</button>
        <button type="button" id="togglePlan">Планировка</button>
        <a href="index.html">На сайт</a>
      </div>
    </div>
    <div id="orbit"></div>
    <video class="dive-film" id="dive" muted playsinline preload="auto"><source src="videos/window.mp4" type="video/mp4"/></video>
    <div id="rooms"></div>
    <div class="orbit-copy" id="orbitCopy">
      <span class="eyebrow" id="orbitEye">Облёт</span>
      <h3 id="orbitTitle">Весь дом</h3>
      <p>Тяните или скролльте — дом можно обойти со всех сторон. Дальше — залёт в окно.</p>
      <button class="window-hit" type="button" id="intoWindow">Залететь в окно</button>
    </div>
    <div class="dots" id="dots"></div>
    <aside class="plan" id="plan">
      <div class="floors" id="floors"></div>
      <div class="grid" id="grid"></div>
      <p class="hint">Сначала облёт, потом окно, потом комнаты.</p>
    </aside>
  </div>
</section>
<script>
const facades=[
  {img:"images/house-front.webp"},
  {img:"images/house.webp"},
  {img:"images/house-side.webp"},
  {img:"images/house-court.webp"}
];
const rooms=[
  {id:"living",p:"Гостиная",t:"Очаг",c:"Вечером огонь и лес за стеклом — будто сидите на опушке, только тепло.",img:"images/living.webp",lq:"images/living.lq.webp"},
  {id:"kitchen",p:"Кухня",t:"Ритм утра",c:"Камень острова холодный на ладонь. Завтрак — и уже виден двор.",img:"images/kitchen.webp",lq:"images/kitchen.lq.webp"},
  {id:"bedroom",p:"Спальня",t:"Тишина",c:"Здесь дом выдыхает. Утром — только лес.",img:"images/bedroom.webp",lq:"images/bedroom.lq.webp"},
  {id:"kids",p:"Детская",t:"Своё окно",c:"Окно в кроны, тёплый пол. Можно шуметь — стены держат.",img:"images/kids.webp",lq:"images/kids.lq.webp"},
  {id:"study",p:"Кабинет",t:"Дверь мягко",c:"Стол к лесу. Здесь думается.",img:"images/study.webp",lq:"images/study.lq.webp"},
  {id:"closet",p:"Гардеробная",t:"Всё на местах",c:"Свет зажигается сам. Пальто, чемоданы, утро без поиска.",img:"images/closet.webp",lq:"images/closet.lq.webp"},
  {id:"bath",p:"Ванная",t:"Камень греет",c:"Ступни на тёплом камне, душ как дождь.",img:"images/bath.webp",lq:"images/bath.lq.webp"},
  {id:"spa",p:"Спа",t:"Жар и вода",c:"Сауна, вода, лес в окошке. Не отель — свой ритуал.",img:"images/spa.webp",lq:"images/spa.lq.webp"},
  {id:"toilet",p:"Туалет",t:"Отдельно",c:"Своя комната, не совмещённая с ванной.",img:"images/toilet.webp",lq:"images/toilet.lq.webp"}
];
const floors=[
  {id:"0",name:"1 этаж",cells:[{id:"living",x:2,y:4,w:46,h:52},{id:"kitchen",x:50,y:4,w:48,h:24},{id:"study",x:50,y:30,w:24,h:26},{id:"spa",x:2,y:58,w:28,h:38},{id:"toilet",x:32,y:58,w:16,h:38},{id:"bath",x:50,y:58,w:48,h:38}]},
  {id:"1",name:"2 этаж",cells:[{id:"bedroom",x:2,y:8,w:48,h:84},{id:"closet",x:52,y:8,w:46,h:36},{id:"kids",x:52,y:48,w:46,h:44}]}
];
const ORBIT_END=0.22,DIVE_END=0.3;
const orbit=document.getElementById("orbit");
const roomsEl=document.getElementById("rooms");
const dotsEl=document.getElementById("dots");
orbit.innerHTML=facades.map(f=>`<div class="orbit-face" style="background-image:url(${f.img})"></div>`).join("");
roomsEl.innerHTML=rooms.map((r,n)=>`<article class="room"><div class="vis" style="background-image:url(${n===0?r.img:r.lq})"></div><div class="copy"><span class="eyebrow">0${n+2} — ${r.p}</span><h3>${r.t}</h3><p>${r.c}</p></div></article>`).join("");
dotsEl.innerHTML=`<i class="on"></i>`+rooms.map(()=>`<i></i>`).join("");
const faces=[...orbit.querySelectorAll(".orbit-face")];
const els=[...roomsEl.querySelectorAll(".room")];
const copies=[...roomsEl.querySelectorAll(".copy")];
const vis=[...roomsEl.querySelectorAll(".vis")];
const dots=[...dotsEl.querySelectorAll("i")];
const dive=document.getElementById("dive");
const orbitCopy=document.getElementById("orbitCopy");
const track=document.getElementById("track");
const loaded=new Set([0,1]);
let yawOff=20,drag=null,frame=0,phase="orbit",floor="0",activeId="";
function shortest(a){return ((a+180)%360+360)%360-180}
function goTo(t){const s=track.offsetTop,e=s+track.offsetHeight-innerHeight;scrollTo({top:s+t*(e-s),behavior:"smooth"})}
function paint(){
  const s=track.offsetTop,e=s+track.offsetHeight-innerHeight;
  const t=Math.min(1,Math.max(0,(scrollY-s)/(e-s||1)));
  if(t<ORBIT_END){
    phase="orbit";
    const yaw=(((t/ORBIT_END)*360+yawOff)%360+360)%360;
    faces.forEach((el,i)=>{const d=Math.abs(shortest(yaw-i*90));const op=Math.max(0,1-d/78);el.style.opacity=op;el.style.transform=`translate3d(0,0,${(1-op)*-240}px) rotateY(${shortest(yaw-i*90)*0.35}deg) scale(${1.04-(1-op)*0.08})`});
    if(dive){dive.pause();dive.currentTime=0;dive.style.opacity=0}
    els.forEach(el=>el.style.opacity=0);copies.forEach(el=>el.style.opacity=0);
    orbitCopy.style.opacity=1;
    document.getElementById("orbitEye").textContent=`Облёт — ${Math.round(yaw)}°`;
    document.getElementById("orbitTitle").textContent="Весь дом";
    dots.forEach((d,n)=>d.classList.toggle("on",n===0));
    activeId="";
    return;
  }
  if(t<DIVE_END){
    phase="dive";
    const u=(t-DIVE_END+ (DIVE_END-ORBIT_END))/(DIVE_END-ORBIT_END);
    const k=(t-ORBIT_END)/(DIVE_END-ORBIT_END);
    faces.forEach((el,i)=>{const court=i===3?1:0.15;el.style.opacity=Math.max(0,(1-k*1.1)*court);el.style.transform=`translate3d(0,0,${k*520}px) scale(${1+k*1.8})`});
    if(dive){dive.style.opacity=Math.min(1,k*1.6);const dur=dive.duration||6;const next=Math.min(dur-0.05,k*dur);if(Math.abs(dive.currentTime-next)>0.08)dive.currentTime=next}
    els.forEach((el,i)=>{el.style.opacity=i===0?Math.max(0,(k-0.62)/0.38):0;el.style.transform=`translate3d(0,0,${(1-k)*-400}px)`});
    copies.forEach(el=>el.style.opacity=0);orbitCopy.style.opacity=1;
    document.getElementById("orbitEye").textContent="Залёт";
    document.getElementById("orbitTitle").textContent="Внутрь";
    return;
  }
  phase="inside";
  if(dive){dive.style.opacity=0;dive.pause()}
  faces.forEach(el=>el.style.opacity=0);orbitCopy.style.opacity=0;
  const p=((t-DIVE_END)/(1-DIVE_END))*(rooms.length-0.001);
  const active=Math.min(rooms.length-1,Math.floor(p));
  activeId=rooms[active].id;
  rooms.forEach((r,i)=>{
    const d=p-i;
    if(Math.abs(d)<1.6&&!loaded.has(i)){loaded.add(i);vis[i].style.backgroundImage=`url(${r.img})`}
    const z=d*1680,scale=1+Math.max(-0.28,Math.min(0.22,d*0.28));
    let op=0,dim=1,clip="inset(0)";
    if(d<0){const ahead=-d;op=ahead>1.12?0:1;dim=0.62+Math.max(0,1-ahead)*0.38;if(ahead>0.38)clip="inset(10% 18% 8% 18%)";else{const k=ahead/0.38;clip=`inset(${10*k}% ${18*k}% ${8*k}% ${18*k}%)`}}
    else{op=Math.max(0,1-d*1.05);dim=Math.max(0.4,1-d*0.5)}
    els[i].style.transform=`translate3d(0,0,${z}px) scale(${scale})`;
    els[i].style.opacity=op;els[i].style.clipPath=clip;els[i].style.filter=`brightness(${dim})`;
    copies[i].style.opacity=(d>-0.18&&d<0.42)?"1":"0";
    dots[i+1].classList.toggle("on",i===active);
  });
  dots[0].classList.remove("on");
  [...document.querySelectorAll(".cell")].forEach(c=>c.classList.toggle("on",c.dataset.id===activeId));
}
function renderPlan(){
  document.getElementById("floors").innerHTML=floors.map(f=>`<button type="button" class="${f.id===floor?"on":""}" data-f="${f.id}">${f.name}</button>`).join("");
  const fl=floors.find(f=>f.id===floor);
  document.getElementById("grid").innerHTML=fl.cells.map(c=>`<button class="cell" data-id="${c.id}" style="left:${c.x}%;top:${c.y}%;width:${c.w}%;height:${c.h}%">${rooms.find(r=>r.id===c.id).p}</button>`).join("");
}
renderPlan();
document.getElementById("floors").onclick=e=>{const b=e.target.closest("button");if(!b)return;floor=b.dataset.f;renderPlan();};
document.getElementById("grid").onclick=e=>{const b=e.target.closest(".cell");if(!b)return;const i=rooms.findIndex(r=>r.id===b.dataset.id);if(i<0)return;goTo(DIVE_END+(i/rooms.length)*(1-DIVE_END)+0.01)};
document.getElementById("intoWindow").onclick=()=>goTo(ORBIT_END+0.01);
document.getElementById("around").onclick=()=>goTo(0);
document.getElementById("togglePlan").onclick=()=>{plan.style.display=plan.style.display==="none"?"block":"none"};
document.getElementById("stage").onpointerdown=e=>{if(e.target.closest("button,a,aside"))return;if(phase!=="orbit")return;drag={x:e.clientX,yaw:yawOff}};
addEventListener("pointermove",e=>{if(!drag||phase!=="orbit")return;yawOff=drag.yaw+(e.clientX-drag.x)*0.28;paint()});
addEventListener("pointerup",()=>{drag=null});
addEventListener("scroll",()=>{if(frame)return;frame=requestAnimationFrame(()=>{frame=0;paint()})},{passive:true});
paint();
</script>
</body>
</html>
