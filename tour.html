<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SHERWOOD · 3D-тур</title>
<meta name="theme-color" content="#0B0B0C"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="preload" as="image" href="images/house.webp"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Manrope:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0b0b0c;--fg:#f4efe6;--muted:#a39a8c;--accent:#c4a574;--line:rgba(244,239,230,.12);--ink:#0b0b0c;--serif:"Cormorant Garamond",Georgia,serif;--sans:Manrope,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
.view{position:absolute;inset:0;overflow:hidden}
.view img{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover}
.view .photo.is-bloom{animation:room-bloom 2.6s cubic-bezier(.22,1,.36,1) both}
@keyframes room-bloom{from{filter:brightness(.18) saturate(.25) blur(12px);transform:scale(1.1);clip-path:inset(0 100% 0 0)}38%{filter:brightness(.72) saturate(.75) blur(2px);clip-path:inset(0 28% 0 0)}to{filter:none;transform:scale(1);clip-path:inset(0)}}
.silk-film{position:absolute;inset:0;z-index:6;width:100%;height:100%;object-fit:cover;mix-blend-mode:screen;opacity:0;pointer-events:none}
.silk-film.is-on{opacity:1;animation:silk-fade 3.4s ease-out both}
@keyframes silk-fade{0%{opacity:0}8%{opacity:1}72%{opacity:1}100%{opacity:0}}
.silk-wave{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;background:linear-gradient(108deg,transparent 28%,rgba(196,165,116,.28) 46%,rgba(244,239,230,.62) 52%,rgba(196,165,116,.22) 58%,transparent 74%);background-size:240% 100%;mix-blend-mode:screen}
.silk-wave.is-on{animation:cloth-sweep 2.4s cubic-bezier(.22,1,.36,1) both}
@keyframes cloth-sweep{from{background-position:110% 0;opacity:.95}to{background-position:-90% 0;opacity:0}}
.view .lq{filter:blur(12px);transform:scale(1.08)}
.shade{position:absolute;inset:0;background:linear-gradient(to top,var(--bg),transparent 45%,rgba(11,11,12,.25));pointer-events:none}
.top{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:22px 8vw;gap:16px;letter-spacing:.18em;text-transform:uppercase;font-size:12px}
.top a,.top button{color:var(--accent);background:none;border:0;font:inherit;letter-spacing:.18em;text-transform:uppercase;min-height:44px;cursor:pointer}
.ui{position:fixed;left:0;bottom:0;z-index:3;max-width:36rem;padding:28px 8vw 32px}
.eyebrow{color:var(--accent);letter-spacing:.22em;text-transform:uppercase;font-size:11px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(32px,5vw,48px);margin-top:8px}
.ui p{color:var(--muted);line-height:1.65;margin:10px 0 16px;max-width:40ch}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row button{background:transparent;color:var(--accent);border:1px solid var(--line);padding:10px 12px;min-height:44px;letter-spacing:.08em;text-transform:uppercase;font-size:11px;cursor:pointer;font-family:var(--sans)}
.row button.on,.row button.go{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.arrow{position:fixed;top:50%;z-index:3;transform:translateY(-50%);width:44px;height:44px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;font-size:22px}
.arrow.prev{left:12px}.arrow.next{right:12px}
.door-layer,.doorway,.door-frame,.door-leaf{display:none}
.plan{position:fixed;right:8vw;bottom:120px;z-index:4;width:min(352px,46vw);border:1px solid var(--line);background:rgba(11,11,12,.84);padding:16px}
.grid{position:relative;height:216px;border:1px solid var(--line);background:rgba(20,19,18,.7)}
.cell{position:absolute;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:rgba(11,11,12,.35);color:var(--fg);font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;font-family:var(--sans)}
.cell.on{border-color:var(--accent);background:rgba(196,165,116,.22);color:var(--accent)}
.hint{margin-top:8px;font-size:11px;color:var(--muted)}
@media(max-width:700px){.arrow{display:none}.plan{left:16px;right:16px;width:auto;bottom:150px}}
</style>
</head>
<body>
<div class="view" id="view"><img class="lq" id="lq" alt=""/><img class="photo" id="photo" alt=""/><span class="silk-wave" id="wave"></span><video class="silk-film" id="silk" muted playsinline preload="auto"><source src="videos/silk.mp4" type="video/mp4"/></video></div>
<div class="top">
  <span>SHERWOOD · 3D-тур</span>
  <div class="row">
    <button type="button" id="around">Вокруг дома</button>
    <button type="button" id="togglePlan">Планировка</button>
    <a href="index.html">На сайт</a>
  </div>
</div>
<button class="arrow prev" id="prev" type="button">‹</button>
<button class="arrow next" id="next" type="button">›</button>
<div class="ui">
  <p class="eyebrow" id="eye"></p>
  <h1 id="title"></h1>
  <p id="copy"></p>
  <div class="row" id="btns"></div>
</div>
<aside class="plan" id="plan">
  <div class="row" id="floors"></div>
  <div class="grid" id="grid"></div>
  <p class="hint">Нажмите комнату — дверь откроет вход.</p>
</aside>
<script>
const facades=[
  {id:"front",p:"Фасад",t:"С улицы",c:"Весь дом в одном взгляде: крылья, кровля, въезд. Так его сдают — не кадром, а объёмом.",img:"images/house-front.webp",lq:"images/house-front.lq.webp"},
  {id:"angle",p:"Объём",t:"Три четверти",c:"Подъезд, крыльцо, оба крыла. Обойдите — и видно, как дом стоит в лесу, а не на картинке.",img:"images/house.webp",lq:"images/house.lq.webp"},
  {id:"side",p:"Торец",t:"Длинный край",c:"Дом вытянут вдоль поляны. Камень, дерево, свет в торце — инженерия не вылезает на фасад.",img:"images/house-side.webp",lq:"images/house-side.lq.webp"},
  {id:"court",p:"Двор",t:"Со стороны леса",c:"Терраса и стекло в кроны. Здесь живут вечером: огонь внутри, лес снаружи, без забора из обещаний.",img:"images/house-court.webp",lq:"images/house-court.lq.webp"}
];
const interiors=[
  {id:"living",p:"Гостиная",t:"Очаг",c:"Вечером огонь и лес за стеклом — будто сидите на опушке, только тепло.",img:"images/living.webp",lq:"images/living.lq.webp"},
  {id:"kitchen",p:"Кухня",t:"Ритм утра",c:"Камень острова холодный на ладонь. Вода, газ и вытяжка спрятаны в каркас.",img:"images/kitchen.webp",lq:"images/kitchen.lq.webp"},
  {id:"bedroom",p:"Спальня",t:"Тишина",c:"Здесь дом выдыхает. Стены не пропускают кухню, шторы сами гасят свет.",img:"images/bedroom.webp",lq:"images/bedroom.lq.webp"},
  {id:"kids",p:"Детская",t:"Своё окно",c:"Окно в кроны, тёплый пол, полки под рост. Можно шуметь — стены держат.",img:"images/kids.webp",lq:"images/kids.lq.webp"},
  {id:"study",p:"Кабинет",t:"Дверь мягко",c:"Стол к лесу, книги в нише, дверь, которая закрывается без хлопка.",img:"images/study.webp",lq:"images/study.lq.webp"},
  {id:"closet",p:"Гардеробная",t:"Всё на местах",c:"Свет зажигается сам. Пальто, чемоданы, утро без поиска.",img:"images/closet.webp",lq:"images/closet.lq.webp"},
  {id:"bath",p:"Ванная",t:"Камень греет",c:"Ступни на тёплом камне, душ как дождь, ванна к окну.",img:"images/bath.webp",lq:"images/bath.lq.webp"},
  {id:"spa",p:"Спа",t:"Жар и вода",c:"Сауна, вода, лес в окошке. Не отель — свой ритуал.",img:"images/spa.webp",lq:"images/spa.lq.webp"},
  {id:"toilet",p:"Туалет",t:"Отдельно",c:"Своя комната, не совмещённая с ванной. Дверь глухая, вентиляция тихая.",img:"images/toilet.webp",lq:"images/toilet.lq.webp"}
];
const floors=[
  {id:"0",name:"1 этаж",cells:[{id:"living",x:2,y:4,w:46,h:52},{id:"kitchen",x:50,y:4,w:48,h:24},{id:"study",x:50,y:30,w:24,h:26},{id:"spa",x:2,y:58,w:28,h:38},{id:"toilet",x:32,y:58,w:16,h:38},{id:"bath",x:50,y:58,w:48,h:38}]},
  {id:"1",name:"2 этаж",cells:[{id:"bedroom",x:2,y:8,w:48,h:84},{id:"closet",x:52,y:8,w:46,h:36},{id:"kids",x:52,y:48,w:46,h:44}]}
];
let mode="orbit", facade=1, active=0, floor="0", planOn=true, bloom=0;
const silk=document.getElementById("silk");
const wave=document.getElementById("wave");
const photo=document.getElementById("photo");
function view(){return mode==="orbit"?facades[facade]:interiors[active]}
function render(){
  const v=view();
  document.getElementById("lq").src=v.lq;
  document.getElementById("photo").src=v.img;
  document.getElementById("eye").textContent=(mode==="orbit"?"Обход — ":"Внутри — ")+v.p;
  document.getElementById("title").textContent=v.t;
  document.getElementById("copy").textContent=v.c;
  const btns=document.getElementById("btns");
  if(mode==="orbit"){
    btns.innerHTML=facades.map((f,i)=>`<button type="button" data-f="${i}" class="${i===facade?"on":""}">${f.p}</button>`).join("")+`<button type="button" class="go" id="enter">Войти в дом</button>`;
    btns.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{facade=+b.dataset.f;render();});
    document.getElementById("enter").onclick=()=>enter("living");
  }else btns.innerHTML="";
  drawPlan();
}
function drawPlan(){
  const fl=floors.find(f=>f.id===floor);
  document.getElementById("floors").innerHTML=floors.map(f=>`<button type="button" class="${f.id===floor?"on":""}" data-fl="${f.id}">${f.name}</button>`).join("");
  document.getElementById("floors").querySelectorAll("button").forEach(b=>b.onclick=()=>{floor=b.dataset.fl;drawPlan();});
  const on=mode==="inside"?interiors[active].id:"";
  document.getElementById("grid").innerHTML=fl.cells.map(c=>{
    const room=interiors.find(r=>r.id===c.id);
    return `<button class="cell${on===c.id?" on":""}" data-id="${c.id}" style="left:${c.x}%;top:${c.y}%;width:${c.w}%;height:${c.h}%">${room.p}</button>`;
  }).join("");
  document.getElementById("grid").querySelectorAll(".cell").forEach(b=>b.onclick=()=>enter(b.dataset.id));
}
function playReveal(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  bloom++;
  photo.classList.remove("is-bloom");
  wave.classList.remove("is-on");
  void photo.offsetWidth;
  photo.classList.add("is-bloom");
  wave.classList.add("is-on");
  silk.currentTime=0;
  silk.classList.add("is-on");
  silk.play();
}
silk.onended=()=>silk.classList.remove("is-on");
function enter(id){
  const i=interiors.findIndex(r=>r.id===id); if(i<0) return;
  mode="inside";active=i;if(id==="bedroom"||id==="kids"||id==="closet") floor="1"; else floor="0";render();
  playReveal();
}
document.getElementById("around").onclick=()=>{mode="orbit";render();};
document.getElementById("togglePlan").onclick=()=>{planOn=!planOn;document.getElementById("plan").style.display=planOn?"block":"none";};
document.getElementById("prev").onclick=()=>{if(mode==="orbit") facade=(facade+3)%4; else {active=Math.max(0,active-1); playReveal();} render();};
document.getElementById("next").onclick=()=>{if(mode==="orbit") facade=(facade+1)%4; else {active=Math.min(interiors.length-1,active+1); playReveal();} render();};
addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") document.getElementById("next").click();
  if(e.key==="ArrowLeft") document.getElementById("prev").click();
});
const box=document.getElementById("view");
let drag=null;
box.onpointerdown=e=>{if(e.target.closest("button,a,aside")) return; if(mode==="orbit") drag={x:e.clientX,from:facade};};
box.onpointermove=e=>{
  if(mode==="inside"){document.getElementById("photo").style.objectPosition=`${50+(0.5-e.clientX/innerWidth)*14}% ${48+(0.5-e.clientY/innerHeight)*8}%`;return;}
  if(!drag) return;
  const dx=e.clientX-drag.x;
  if(Math.abs(dx)>64){facade=dx<0?(drag.from+1)%4:(drag.from+3)%4;drag={x:e.clientX,from:facade};render();}
};
box.onpointerup=()=>{drag=null};
render();
</script>
</body>
</html>
