<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SHERWOOD · 3D-тур</title>
<meta name="theme-color" content="#0B0B0C"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="preload" as="image" href="images/yard.webp"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Manrope:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0b0b0c;--fg:#f4efe6;--muted:#a39a8c;--accent:#c4a574;--line:rgba(244,239,230,.12);--ink:#0b0b0c;--serif:"Cormorant Garamond",Georgia,serif;--sans:Manrope,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
.stage{position:absolute;inset:0;overflow:hidden;opacity:0;transform:scale(1.12);transition:opacity .52s cubic-bezier(.22,1,.36,1),transform .72s cubic-bezier(.22,1,.36,1)}
.stage.on{opacity:1;transform:scale(1)}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .lq{transform:scale(1.1);filter:blur(12px)}
.stage .full{opacity:0;transition:opacity .3s ease-out}
.stage .full.ready{opacity:1}
.shade{position:absolute;inset:0;background:linear-gradient(to top,var(--bg),transparent 45%,rgba(11,11,12,.2));pointer-events:none}
.top{position:fixed;top:0;left:0;right:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:22px 8vw;letter-spacing:.24em;text-transform:uppercase;font-size:12px;font-family:var(--serif)}
.top a{color:var(--accent);text-decoration:none;font-family:var(--sans);min-height:44px;display:inline-flex;align-items:center}
.ui{position:fixed;left:0;right:0;bottom:0;z-index:2;max-width:42rem;padding:28px 8vw 32px}
.ui .eyebrow{color:var(--accent);letter-spacing:.22em;text-transform:uppercase;font-size:11px;margin-bottom:8px}
.ui h1{font-family:var(--serif);font-weight:400;font-size:clamp(32px,5vw,48px)}
.ui p{color:var(--muted);line-height:1.65;margin:8px 0 16px;max-width:36ch}
.rooms{display:flex;flex-wrap:wrap;gap:8px}
.rooms button{background:transparent;color:var(--accent);border:1px solid var(--line);padding:10px 12px;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;font-size:11px;min-height:44px;font-family:var(--sans)}
.rooms button.on{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.arrow{position:fixed;top:50%;z-index:2;transform:translateY(-50%);width:44px;height:44px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;font-size:22px}
.arrow:disabled{opacity:.3}
.arrow.prev{left:12px}
.arrow.next{right:12px}
@media(max-width:700px){.arrow{display:none}}
@media(prefers-reduced-motion:reduce){.stage{transform:none;transition:opacity .28s ease-out}}
</style>
</head>
<body>
<div class="top"><span>SHERWOOD · 3D-тур</span><a href="index.html">На сайт</a></div>
<button class="arrow prev" id="prev" type="button" aria-label="Предыдущая комната">‹</button>
<button class="arrow next" id="next" type="button" aria-label="Следующая комната">›</button>
<div id="stage"></div>
<div class="shade"></div>
<div class="ui">
  <p class="eyebrow" id="eye"></p>
  <h1 id="title"></h1>
  <p id="copy"></p>
  <div class="rooms" id="btns"></div>
</div>
<script>
const rooms=[
  {i:"01",p:"Дом",t:"Весь объём",c:"Смотрите сразу целиком: крылья, крыша, двор, лес вокруг. Дом не прячется за кадром — он стоит, как его потом сдадут.",img:"images/house.webp",lq:"images/house.lq.webp"},
  {i:"02",p:"Гостиная",t:"Очаг",c:"Вечером огонь и лес за стеклом — будто сидите на опушке, только тепло. Голоса не гуляют эхом, диван не смотрит в телевизор, он смотрит в кроны.",img:"images/living.webp",lq:"images/living.lq.webp"},
  {i:"03",p:"Кухня",t:"Ритм утра",c:"Камень острова холодный на ладонь. Вода, газ и вытяжка спрятаны в каркас: готовка без шума и запаха по дому. Завтрак — и уже виден двор.",img:"images/kitchen.webp",lq:"images/kitchen.lq.webp"},
  {i:"04",p:"Спальня",t:"Тишина",c:"Здесь дом выдыхает. Стены не пропускают кухню, шторы сами гасят свет, воздух не сушит кожу. Утром — только лес, без будильника с соседней комнаты.",img:"images/bedroom.webp",lq:"images/bedroom.lq.webp"},
  {i:"05",p:"Детская",t:"Своё окно",c:"Окно в кроны, тёплый пол, полки под рост. Можно шуметь — стены держат. Вечером лампа у кровати, утром — свой свет, не общий коридор.",img:"images/kids.webp",lq:"images/kids.lq.webp"},
  {i:"06",p:"Кабинет",t:"Дверь мягко",c:"Стол к лесу, книги в нише, дверь, которая закрывается без хлопка. Здесь думается. Никто не проходит насквозь — это не проходная.",img:"images/study.webp",lq:"images/study.lq.webp"},
  {i:"07",p:"Гардеробная",t:"Всё на местах",c:"Свет зажигается сам. Пальто, чемоданы, утро без поиска. Никаких стульев с одеждой в спальне — дому не нужно выглядеть как примерочная.",img:"images/closet.webp",lq:"images/closet.lq.webp"},
  {i:"08",p:"Ванная",t:"Камень греет",c:"Ступни на тёплом камне, душ как дождь, ванна к окну. Пар уходит в рекуперацию, не в коридор. После леса — вода, и снова тишина.",img:"images/bath.webp",lq:"images/bath.lq.webp"},
  {i:"09",p:"Спа",t:"Жар и вода",c:"Сауна, вода, лес в окошке. Не отель — свой ритуал. Вышли, легли на тёплый пол, и дом ещё держит тепло, когда уже спите.",img:"images/spa.webp",lq:"images/spa.lq.webp"},
  {i:"10",p:"Туалет",t:"Отдельно",c:"Своя комната, не совмещённая с ванной. Дверь глухая, вентиляция тихая, свет мягкий. Гости не ищут его по дому — он на своём месте.",img:"images/toilet.webp",lq:"images/toilet.lq.webp"}
];
let active=0;
const mounted=new Set([0,1]);
const stage=document.getElementById("stage");
const btns=document.getElementById("btns");
stage.innerHTML=rooms.map((r,n)=>`<div class="stage${n?"":" on"}" data-i="${n}"><img class="lq" src="${r.lq}" alt="" width="48" height="27"/></div>`).join("");
btns.innerHTML=rooms.map((r,n)=>`<button type="button" data-i="${n}" class="${n?"":"on"}">${r.p}</button>`).join("");
function mount(n){
  [n-1,n,n+1].forEach(i=>{
    if(i<0||i>=rooms.length) return;
    mounted.add(i);
    const box=document.querySelector(`.stage[data-i="${i}"]`);
    if(box.querySelector(".full")) return;
    const img=new Image();
    img.className="full";
    img.alt="";
    img.width=1600; img.height=900;
    img.decoding=i===active?"sync":"async";
    img.fetchPriority=i===active?"high":"low";
    img.onload=()=>img.classList.add("ready");
    img.src=rooms[i].img;
    box.appendChild(img);
  });
}
function go(n){
  active=Math.max(0,Math.min(rooms.length-1,n));
  const r=rooms[active];
  document.getElementById("eye").textContent=`${r.i} — ${r.p}`;
  document.getElementById("title").textContent=r.t;
  document.getElementById("copy").textContent=r.c;
  document.querySelectorAll(".stage").forEach((el,i)=>el.classList.toggle("on",i===active));
  document.querySelectorAll(".rooms button").forEach((b,i)=>b.classList.toggle("on",i===active));
  document.getElementById("prev").disabled=active===0;
  document.getElementById("next").disabled=active===rooms.length-1;
  mount(active);
}
document.getElementById("prev").onclick=()=>go(active-1);
document.getElementById("next").onclick=()=>go(active+1);
btns.onclick=e=>{const b=e.target.closest("button"); if(b) go(+b.dataset.i)};
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(active+1);if(e.key==="ArrowLeft")go(active-1)});
go(0);
const idle=window.requestIdleCallback||(cb=>setTimeout(cb,600));
idle(()=>rooms.forEach(r=>{const i=new Image(); i.src=r.img;}));
</script>
</body>
</html>
